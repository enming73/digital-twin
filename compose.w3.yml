services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["--listen", "0.0.0.0:8080", "--mqtt-url", "tcp://mosquitto:1883", "--run-id", "demo-run", "--expect-fresh-run"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 2s
      timeout: 2s
      retries: 20
  simulator:
    depends_on:
      backend:
        condition: service_healthy
