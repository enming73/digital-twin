events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_origin $w4_origin_allowed {
    default 0;
    "http://localhost:4174" 1;
    "http://127.0.0.1:4174" 1;
  }
  server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host backend:8080; }
    location /ws/ {
      if ($w4_origin_allowed = 0) { return 403; }
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host backend:8080;
      proxy_set_header Origin http://backend:8080;
    }
  }
}
